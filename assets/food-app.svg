<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210">
<defs><linearGradient id="fb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#1b1408"/></linearGradient>
<linearGradient id="rd" x1="0" x2="1"><stop offset="0" stop-color="#ED8B00"/><stop offset="1" stop-color="#6DB33F"/></linearGradient></defs>
<style>.ct{font:600 14px 'Segoe UI',Arial,sans-serif;fill:#e6edf3}.ti{font:800 20px 'Segoe UI',Arial,sans-serif;fill:#e6edf3}.em{font-size:34px}@keyframes ch0{0%,25%{opacity:.35}26%,99%{opacity:0}100%{opacity:.35}}@keyframes ch1{0%,25%{opacity:0}26%,50%{opacity:.35}51%,100%{opacity:0}}@keyframes ch2{0%,50%{opacity:0}51%,75%{opacity:.35}76%,100%{opacity:0}}@keyframes ch3{0%,75%{opacity:0}76%,100%{opacity:.35}100%,100%{opacity:0}}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}@keyframes dash{to{stroke-dashoffset:-40}}</style>
<rect width="900" height="210" rx="14" fill="url(#fb)" stroke="#30363d"/>
<text x="450" y="34" text-anchor="middle" class="ti">🔥 Now Building: Food Delivery App</text>
<path id="road" d="M90 100 C 250 40, 400 140, 560 80 S 760 100, 810 100" fill="none" stroke="url(#rd)" stroke-width="3" stroke-dasharray="12 8" style="animation:dash 1.2s linear infinite"/>
<g transform="translate(90,100)"><text class="em" text-anchor="middle" y="12" style="animation:pu 2s ease-in-out infinite;transform-origin:0 0">🍽️</text></g>
<g transform="translate(810,100)"><text class="em" text-anchor="middle" y="12" style="animation:pu 2s ease-in-out infinite .6s;transform-origin:0 0">🏠</text></g>
<text class="em" text-anchor="middle" y="12"><animateMotion dur="8s" repeatCount="indefinite" rotate="0"><mpath href="#road"/></animateMotion>🛵</text>
<g transform="translate(60,148)"><rect width="190" height="40" rx="20" fill="#161b22" stroke="#30363d"/><rect width="190" height="40" rx="20" fill="#ED8B00" style="animation:ch0 8s linear infinite" opacity="0"/><text x="95" y="26" text-anchor="middle" class="ct">🧾 Order placed</text></g><g transform="translate(265,148)"><rect width="190" height="40" rx="20" fill="#161b22" stroke="#30363d"/><rect width="190" height="40" rx="20" fill="#6DB33F" style="animation:ch1 8s linear infinite" opacity="0"/><text x="95" y="26" text-anchor="middle" class="ct">👨‍🍳 Cooking</text></g><g transform="translate(470,148)"><rect width="190" height="40" rx="20" fill="#161b22" stroke="#30363d"/><rect width="190" height="40" rx="20" fill="#0077B5" style="animation:ch2 8s linear infinite" opacity="0"/><text x="95" y="26" text-anchor="middle" class="ct">🛵 On the way</text></g><g transform="translate(675,148)"><rect width="190" height="40" rx="20" fill="#161b22" stroke="#30363d"/><rect width="190" height="40" rx="20" fill="#DB2777" style="animation:ch3 8s linear infinite" opacity="0"/><text x="95" y="26" text-anchor="middle" class="ct">🏠 Delivered</text></g>
</svg>